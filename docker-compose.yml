services:
  postgres:
    image: postgres:16
    container_name: translate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: translate_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-translate-data:/var/lib/postgresql/data


volumes:
  postgres-translate-data: